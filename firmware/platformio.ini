; Scare controller firmware
;
;   pio run -e esp32s3            build for the board
;   pio run -e esp32s3 -t upload  flash the board over USB
;   pio test -e native            run the show-engine unit tests on your PC

[platformio]
default_envs = esp32s3

[env]
lib_deps =
    bblanchon/ArduinoJson@^7.2.0
test_framework = unity

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
; ESP32-S3-DevKitC-1-N8R8: 8 MB flash, 8 MB octal PSRAM
board_build.flash_size = 8MB
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 8MB
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
build_unflags = -std=gnu++11
monitor_speed = 115200

; PC-side tests. Needs a C++ compiler (MinGW/MSYS2 on Windows, Xcode tools on Mac).
[env:native]
platform = native
build_flags = -std=gnu++17 -Wall -Wextra
